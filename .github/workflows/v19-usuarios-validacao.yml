name: "V19 · usuários · verificação sem deploy"
on:
  push:
    branches: [fix/v19-usuarios-persistentes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: JavaScript do módulo de usuários
        run: node --check teste-v19/v19-usuarios.js
      - name: Compatibilidade estática V19
        run: node scripts/verificar-v19.mjs
      - name: Checagem TypeScript Edge Function
        run: deno check supabase/functions/v19-usuarios/index.ts

name: V18 - Testes visuais sem modificar o banco
on:
  push:
    branches: [homologacao-v18]
    paths:
      - 'index.html'
      - 'testes/**'
      - '.github/workflows/testes-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressão de criação e estoque (sem rede)
        run: node testes/regressao-v18.cjs index.html
      - name: Validar contrato de assunção de chamados
        run: node testes/teste-contrato-assuncao.js
      - name: Instalar Playwright/Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Servir HTML da homologação
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aponte.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
      - name: Testar frontend homologação
        env:
          APP_URL: http://127.0.0.1:8765/
          TEST_LABEL: homologacao
        run: node testes/smoke-publico.js
      - name: Testar site publicado
        env:
          APP_URL: https://easyobrasandroid-source.github.io/aponte-cidadao/teste-v18/
          TEST_LABEL: publicado
        run: node testes/smoke-publico.js
      - name: Guardar vídeo, imagens e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aponte-v18-evidencias-visuais
          path: testes/evidencias/
          if-no-files-found: warn
          retention-days: 14
